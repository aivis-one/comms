# =============================================================================
# COMMS Service -- CI (handoff item 5)
# =============================================================================
# Ephemeral Postgres 16 service container; schema via `alembic upgrade
# head`; then pytest + ruff + mypy. NO deploy steps, NO SSH, NO secrets
# (deploy wiring is Phase 5).
# =============================================================================

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comms
          POSTGRES_PASSWORD: comms
          # T-78: the suite refuses to run against a database whose
          # name does not end in _test, because it deletes every row
          # before each test. The rule has no exceptions, so CI obeys it
          # like every other caller rather than being one.
          POSTGRES_DB: comms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comms -d comms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://comms:comms@localhost:5432/comms_test
      # Required outside development; `alembic upgrade head` below
      # builds the settings before the suite's own fence runs. A test
      # value -- the suite replaces it anyway (tests/conftest.py).
      COMMS_SERVICE_TOKEN: ci-not-a-secret-service-token

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From the lock, so CI tests the package set the image ships --
      # the project itself without deps, since the lock already has
      # them and re-resolving would defeat the pin.
      - name: Install dependencies (pinned)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      # Turns the autogenerate filter from a patch into a detector
      # (R-3). Red when a model changed without a migration, and red
      # when a migration-only object was added without being listed in
      # app/core/schema_objects.py. It says nothing about the objects
      # already listed there -- the suite asserts those exist.
      - name: Schema matches the models (alembic check)
        run: alembic check

      - name: Run tests
        run: pytest -q

      - name: Lint (ruff)
        run: ruff check .

      - name: Domain-literal fence (arch doc §2.6 / decision 13)
        run: python scripts/check_domain_literals.py

      - name: Product-literal fence (arch doc #15, Release-Hardening)
        run: python scripts/check_product_literals.py

      - name: Type check (mypy)
        run: mypy app
