# =============================================================================
# COMMS Service -- CI (handoff item 5)
# =============================================================================
# Four jobs. Beside them all, on its own (W2-2, W1-2):
#   machine  the repository checked by the deploy machine's own code,
#            pinned to one commit of its repository: `pridem check` whole
#            -- primer.yaml and the compose file -- and the seams
#            (scripts/check_primer_yaml.py).
# First of the other three, alone (CI-1):
#   checks what reads the tree and the schema and takes seconds: ruff,
#          mypy, the two fences, `alembic upgrade head` + `alembic
#          check`, the suite's collection, the tree's guards -- a small
#          mistake is red in minutes, and the two full jobs do not start.
#          It also makes the suite's THREE PARTS (CI-2, step `parts`) and
#          holds that together they are the whole suite, nothing twice.
# Then, side by side, both after `checks` (needs), each in the same three
# parts at once -- a matrix, every part run to its end:
#   test   the suite on the runner's Python 3.12 against Postgres; schema
#          via `alembic upgrade head`; the slowest nodes and the time of
#          every file printed (--durations, the junit report).
#   image  the comms image built from the Dockerfile -- its base pinned
#          by digest -- in both of its stages that run something: the
#          suite runs INSIDE the `test` stage, as the deploy machine runs
#          it (W1-1: the stage carries the tree, nothing is mounted), on
#          the Python and Debian the boxes run, not the runner's; the
#          `runtime` stage starts and answers, carries exactly the
#          runtime lock, and has the `comms` command (W2-2).
# Postgres is the image deploy/docker-compose.yml pins for comms-postgres,
# read from there (H10): one pin, kept by Dependabot's docker-compose
# ecosystem, and CI on the database the boxes run. A `services:` image
# here would be a second pin no Dependabot ecosystem updates.
# NO deploy steps, NO SSH, NO secrets (deploy wiring is Phase 5).
# =============================================================================

name: CI

on:
  push:
  pull_request:

# THE TOKEN GETS NOTHING BY DEFAULT (TX-4): each job says what it needs,
# and every one only reads the repository. tests/test_deploy_hardening.py holds
# every job to a `permissions` of its own.
permissions: {}

jobs:
  # THE FAST CHECKS FIRST (CI-1): until CI-1 ruff, mypy and the fences
  # ran after the whole suite, and a broken reference in a comment (the
  # guard in tests/test_g2_hygiene.py) was red only at its end -- a
  # one-line fix cost the full run. Everything here reads the tree or the
  # schema; the guards are listed by file (a file renamed or gone is an
  # error of pytest, red), and they stay in the full suite too.
  checks:
    runs-on: ubuntu-latest
    # Its commands take ~1 min, the setup ~2 min.
    timeout-minutes: 10
    permissions:
      contents: read
    # The pytest arguments of the three parts, read by `test` and `image`
    # (needs.checks.outputs): made once, held once, below.
    outputs:
      part1: ${{ steps.parts.outputs.part1 }}
      part2: ${{ steps.parts.outputs.part2 }}
      part3: ${{ steps.parts.outputs.part3 }}

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://comms:comms@localhost:5432/comms_test
      COMMS_SERVICE_TOKEN: ci-not-a-secret-service-token
      # Every channel's flag is required at every start (W2-1,
      # app/core/channels.py), `alembic` below included; off -- the
      # suite switches on what it tests (tests/conftest.py).
      TELEGRAM_ENABLED: "false"
      EMAIL_ENABLED: "false"
      LLM_ENABLED: "false"
      # The instance's languages (W4-1), required at every start, as the
      # passport gives them on a box: a start without them is refused.
      LANGUAGES: en,ru
      DEFAULT_LANGUAGE: en
      # The release every log line names (W3-2, protocol 9.4): what the
      # image carries from the machine's build argument (job `image`),
      # here from the run -- a process of comms without it refuses to
      # start (app/core/logging.py release_from_environment).
      PRIMER_RELEASE: ${{ github.ref_name }}
      # The commit /health names (W3-1): the API refuses to start without
      # it (app/api/report.py commit_from_environment), and the suite
      # answers /health -- here from the run, as the image from its
      # build argument.
      PRIMER_COMMIT: ${{ github.sha }}
      # The package from the checkout, as the image has it from /app
      # (Dockerfile, PYTHONPATH) -- not installed (REV-5, see below).
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # No token left in .git/config: the checkout is mounted into the
        # containers the suite runs in (REV-5).
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # Every package from the dev lock (the runtime's and the tools'),
      # hash-checked -- the flag written out (W1-1); the project itself is
      # not installed (REV-5): `pip install -e .` built it with whatever
      # setuptools the index served, no pin and no hash. PYTHONPATH
      # (above) finds it, as the image does.
      - name: Install dependencies (pinned)
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Domain-literal fence (arch doc §2.6 / decision 13)
        run: python scripts/check_domain_literals.py

      - name: Product-literal fence (arch doc #15, Release-Hardening)
        run: python scripts/check_product_literals.py

      - name: Type check (mypy)
        run: mypy app

      # Every test module imports: a syntax or import error in one is red
      # here, not after the suite's first 3000 nodes.
      - name: The suite collects
        run: pytest --collect-only -q

      # THE THREE PARTS (CI-2), the one place they are written. Parts 1
      # and 2 are lists of files, by the time of each file measured in CI
      # (the step `Suite time by file`, run #299: ~247 s and ~237 s);
      # part 3 is every other file -- `tests` without them (--ignore),
      # so a new test file is in part 3 by itself. Held here: the parts
      # together collect as many nodes as the whole suite and share no
      # file. By count and by file, not by node id: one id is made at
      # collection from the clock (tests/test_changes_feed.py, the
      # malformed cursor) and differs between two collections. A file
      # of a list that is not in the tree fails its collection: red.
      - name: The three parts are the suite
        id: parts
        env:
          PART_1: >-
            tests/test_migration_0037.py
            tests/test_migration_0013.py
            tests/test_migration_0038.py
            tests/test_migration_0012.py
            tests/test_migration_0014.py
            tests/test_migration_0035.py
          PART_2: >-
            tests/test_lane_wake.py
            tests/test_lane_jobs.py
            tests/test_unread_index.py
            tests/test_waiting_probe.py
            tests/test_h9_release.py
            tests/test_json_null.py
        run: |
          set -o pipefail
          part3=tests
          for f in $PART_1 $PART_2; do part3="$part3 --ignore=$f"; done
          nodes() { pytest --collect-only -q "$@" | grep '::'; }
          nodes > "$RUNNER_TEMP/whole"
          whole=$(wc -l < "$RUNNER_TEMP/whole")
          total=0
          : > "$RUNNER_TEMP/files"
          for n in 1 2 3; do
            case $n in 1) args=$PART_1 ;; 2) args=$PART_2 ;; 3) args=$part3 ;; esac
            # unquoted on purpose: a list of arguments
            nodes $args > "$RUNNER_TEMP/part$n"
            count=$(wc -l < "$RUNNER_TEMP/part$n")
            echo "part $n: $count nodes"
            total=$((total + count))
            cut -d: -f1 "$RUNNER_TEMP/part$n" | sort -u >> "$RUNNER_TEMP/files"
          done
          echo "the whole suite: $whole nodes; the three parts: $total"
          shared=$(sort "$RUNNER_TEMP/files" | uniq -d)
          if [ -n "$shared" ]; then echo "in more than one part: $shared"; exit 1; fi
          if [ "$total" -ne "$whole" ]; then echo "the parts are not the suite"; exit 1; fi
          {
            echo "part1=$PART_1"
            echo "part2=$PART_2"
            echo "part3=$part3"
          } >> "$GITHUB_OUTPUT"

      # The same step as in `test` below.
      - name: Start Postgres (the image deploy/docker-compose.yml pins)
        run: |
          image=$(python -c "import yaml; print(yaml.safe_load(open('deploy/docker-compose.yml'))['services']['comms-postgres']['image'])")
          echo "comms-postgres image: $image"
          docker run -d --name comms-postgres -p 5432:5432 \
            -e POSTGRES_USER=comms -e POSTGRES_PASSWORD=comms \
            -e POSTGRES_DB=comms_test "$image"
          for _ in $(seq 60); do
            if docker exec comms-postgres pg_isready -h 127.0.0.1 -U comms -d comms_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs comms-postgres
          exit 1

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Schema matches the models (alembic check)
        run: alembic check

      # The guards that read the tree and take seconds: references in
      # comments, the pytest cache, SQL by shape, the fences' own tests.
      # Not here: tests/test_g1_hygiene.py (it calls the API and races
      # real sessions) and tests/test_hygiene_r7.py (it starts the app).
      - name: The tree's guards
        run: >-
          pytest -q
          tests/test_g2_hygiene.py
          tests/test_fence_roots.py
          tests/test_domain_literal_fence.py
          tests/test_product_literal_fence.py

  # THE REPOSITORY AS THE MACHINE READS IT (W2-2, W1-2): the deploy
  # machine's own code, pinned to one commit of its repository -- `pridem
  # check` of the repository whole (primer.yaml, and the compose file
  # through the runner's `docker compose config`: the binary, no daemon)
  # and the seams of a box, and comms' /health as the machine reads it
  # after `up` (W3-1) (scripts/check_primer_yaml.py says what each is,
  # and the one finding allowed until W4-1). The machine is installed from
  # ITS lock and ITS wheels, both in
  # its repository at that commit, hash-checked -- into a venv of its own:
  # its pydantic is not comms' (requirements-dev.lock), and comms' locks
  # cannot carry it (a git dependency is not hash-checked). Nothing else
  # runs in this venv. A new commit of the machine: the `ref` below, alone.
  machine:
    runs-on: ubuntu-latest
    # Two checkouts, a venv from local wheels, one script: ~1 min.
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the machine (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: inzoddwetrust/primer
          ref: 213a3ed250f14203e6608b0d0733fb9d2dc889a2
          path: .primer
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # The venv first on PATH for the steps after this one.
      - name: A venv for the machine
        run: |
          python -m venv "$RUNNER_TEMP/machine"
          echo "$RUNNER_TEMP/machine/bin" >> "$GITHUB_PATH"

      # Its lock, from the wheels the machine keeps beside it -- no index.
      - name: Install the machine's packages (its lock, pinned)
        env:
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: .primer/wheels
        run: pip install --require-hashes -r .primer/requirements.lock

      - name: The repository by the machine (pridem check, the seams, /health)
        env:
          PYTHONPATH: ${{ github.workspace }}/.primer
        run: python scripts/check_primer_yaml.py

  test:
    needs: checks
    # THE SUITE IN THREE PARTS AT ONCE (CI-2): the arguments are the
    # `checks` job's (step `parts`); every part runs to its end -- a red
    # part does not cancel the others, whose defects would surface only
    # on the next round.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    # A HANG IS RED (FIX review 3.13.0, the second): the last green run's
    # suite took 931 s (~16 min with its setup) -- 40 gives ~2.5x.
    timeout-minutes: 40
    permissions:
      contents: read

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://comms:comms@localhost:5432/comms_test
      # Required outside development; `alembic upgrade head` below
      # builds the settings before the suite's own fence runs. A test
      # value -- the suite replaces it anyway (tests/conftest.py).
      COMMS_SERVICE_TOKEN: ci-not-a-secret-service-token
      # The channel flags, as in `checks` (W2-1).
      TELEGRAM_ENABLED: "false"
      EMAIL_ENABLED: "false"
      LLM_ENABLED: "false"
      # The instance's languages, as in `checks` (W4-1).
      LANGUAGES: en,ru
      DEFAULT_LANGUAGE: en
      PART_ARGS: ${{ needs.checks.outputs[format('part{0}', matrix.part)] }}
      # The release every log line names, as in `checks` (W3-2).
      PRIMER_RELEASE: ${{ github.ref_name }}
      # The commit /health names, as in `checks` (W3-1).
      PRIMER_COMMIT: ${{ github.sha }}
      # The package from the checkout, as in `checks` (REV-5).
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # No token left in .git/config: the checkout is mounted into the
        # containers the suite runs in (REV-5).
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # From the dev lock, so CI tests the package set the test stage
      # carries (W1-1), hash-checked; the project itself is not installed
      # -- PYTHONPATH (above), as the image (REV-5).
      - name: Install dependencies (pinned)
        run: pip install --require-hashes -r requirements-dev.lock

      # The pinned image, from deploy/docker-compose.yml. Ready is asked
      # over TCP: during initdb the image's temporary server listens on
      # the socket only, so a TCP answer is the server that stays.
      # T-78: the suite refuses a database whose name does not end in
      # _test, because it deletes every row before each test.
      - name: Start Postgres (the image deploy/docker-compose.yml pins)
        run: |
          image=$(python -c "import yaml; print(yaml.safe_load(open('deploy/docker-compose.yml'))['services']['comms-postgres']['image'])")
          echo "comms-postgres image: $image"
          docker run -d --name comms-postgres -p 5432:5432 \
            -e POSTGRES_USER=comms -e POSTGRES_PASSWORD=comms \
            -e POSTGRES_DB=comms_test "$image"
          for _ in $(seq 60); do
            if docker exec comms-postgres pg_isready -h 127.0.0.1 -U comms -d comms_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs comms-postgres
          exit 1

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      # Turns the autogenerate filter from a patch into a detector
      # (R-3). Red when a model changed without a migration, and red
      # when a migration-only object was added without being listed in
      # app/core/schema_objects.py. It says nothing about the objects
      # already listed there -- the suite asserts those exist.
      - name: Schema matches the models (alembic check)
        run: alembic check

      # This part of the suite (PART_ARGS); the 50 slowest nodes are
      # printed at its end (CI-1), and every node's time goes to a junit
      # report outside the checkout.
      - name: Run tests
        run: >-
          pytest -q --durations=50 $PART_ARGS
          -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/suite.xml"

      # This part's time by file, from that report, the slowest first --
      # what the split is made of. Run whether the part was green or red.
      - name: Suite time by file
        if: always()
        run: >-
          test -f "$RUNNER_TEMP/suite.xml" &&
          python -c "import collections, sys, xml.etree.ElementTree as E;
          t = collections.Counter();
          [t.update({c.get('file'): float(c.get('time', 0))}) for c in E.parse(sys.argv[1]).getroot().iter('testcase')];
          [print(f'{s:8.1f}s  {f}') for f, s in t.most_common()];
          print(f'{sum(t.values()):8.1f}s  total')" "$RUNNER_TEMP/suite.xml"

  image:
    needs: checks
    # The same three parts as `test` (CI-2), each on its own runner with
    # its own build of the image.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    # The image's build plus a part of the suite inside it.
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      PART_ARGS: ${{ needs.checks.outputs[format('part{0}', matrix.part)] }}
      # The deploy machine's two build arguments (W1-1, Dockerfile header):
      # what was built and from which commit, as the machine passes them.
      PRIMER_RELEASE: ${{ github.ref_name }}
      PRIMER_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # No token left in .git/config: the checkout is mounted into the
        # containers the suite runs in (REV-5).
        with:
          persist-credentials: false

      # Only to read the compose file (PyYAML at the lock's version).
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # PyYAML's own stanza of the runtime lock -- its version and its
      # hashes, one source -- installed hash-checked (REV-5; was a bare
      # pin).
      - name: Read the compose file's pins
        run: |
          awk '/^pyyaml==/{on=1} on && /^[a-z]/ && !/^pyyaml==/{exit} on && !/^ *#/{print}' requirements.lock > "$RUNNER_TEMP/pyyaml.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/pyyaml.txt"

      # Every image the compose file pins is pulled by its digest -- a pin
      # that does not resolve (a typo, a digest withdrawn) is red here,
      # before any box meets it.
      - name: Pull every image deploy/docker-compose.yml pins
        run: |
          python -c "import yaml; [print(s['image']) for s in yaml.safe_load(open('deploy/docker-compose.yml'))['services'].values() if 'image' in s]" |
          while read -r image; do
            docker pull "$image"
          done
      # The pinned image, from deploy/docker-compose.yml. Ready is asked
      # over TCP: during initdb the image's temporary server listens on
      # the socket only, so a TCP answer is the server that stays.
      # T-78: the suite refuses a database whose name does not end in
      # _test, because it deletes every row before each test.
      - name: Start Postgres (the image deploy/docker-compose.yml pins)
        run: |
          image=$(python -c "import yaml; print(yaml.safe_load(open('deploy/docker-compose.yml'))['services']['comms-postgres']['image'])")
          echo "comms-postgres image: $image"
          docker run -d --name comms-postgres -p 5432:5432 \
            -e POSTGRES_USER=comms -e POSTGRES_PASSWORD=comms \
            -e POSTGRES_DB=comms_test "$image"
          for _ in $(seq 60); do
            if docker exec comms-postgres pg_isready -h 127.0.0.1 -U comms -d comms_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs comms-postgres
          exit 1

      # Both stages that run something, with the machine's arguments
      # (W1-1): `test` by its name, the runtime by building without
      # --target (the last stage, as compose and the machine build it).
      # The builder is built once: the second build takes it from the
      # first's cache.
      - name: Build the comms image (the Dockerfile's pinned base)
        run: |
          docker build --target test -t comms:test \
            --build-arg PRIMER_RELEASE="$PRIMER_RELEASE" \
            --build-arg PRIMER_COMMIT="$PRIMER_COMMIT" .
          docker build -t comms:ci \
            --build-arg PRIMER_RELEASE="$PRIMER_RELEASE" \
            --build-arg PRIMER_COMMIT="$PRIMER_COMMIT" .

      # WHAT EACH STAGE CARRIES, read from the built images (W1-1): the
      # runtime's venv is the runtime lock exactly -- not a dev package,
      # not a package of no lock -- and the test stage's holds the whole
      # dev lock. pip itself is the base image's (Dockerfile). Once per
      # build is enough: part 1 only (CI-2).
      - name: The runtime carries the runtime lock, the test stage the dev lock
        if: matrix.part == 1
        run: |
          docker run --rm comms:ci python -m pip list --format=freeze > "$RUNNER_TEMP/runtime.txt"
          docker run --rm comms:test python -m pip list --format=freeze > "$RUNNER_TEMP/test.txt"
          python -c "import re, sys
          def pins(path):
              found = re.findall(r'^([A-Za-z0-9_.-]+)==(\S+)', open(path).read(), re.M)
              return {(n.lower().replace('_', '-'), v) for n, v in found if n.lower() != 'pip'}
          runtime, test = pins(sys.argv[1]), pins(sys.argv[2])
          prod, dev = pins('requirements.lock'), pins('requirements-dev.lock')
          assert prod and dev, 'the pair: the locks read as pins'
          assert runtime == prod, ('runtime', sorted(runtime ^ prod))
          assert dev <= test, ('test', sorted(dev - test))
          print(f'runtime: {len(runtime)} = the runtime lock; test: {len(test)} >= the dev lock ({len(dev)})')" "$RUNNER_TEMP/runtime.txt" "$RUNNER_TEMP/test.txt"

      # The machine's two arguments reach the process of each stage, as
      # built above -- the value, not only the name (W1-1).
      - name: Both stages hand the machine's arguments to the process
        if: matrix.part == 1
        run: |
          check='test "$PRIMER_RELEASE" = "$1" && test "$PRIMER_COMMIT" = "$2"'
          docker run --rm comms:ci sh -c "$check" _ "$PRIMER_RELEASE" "$PRIMER_COMMIT"
          docker run --rm comms:test sh -c "$check" _ "$PRIMER_RELEASE" "$PRIMER_COMMIT"
          echo "both stages: PRIMER_RELEASE=$PRIMER_RELEASE PRIMER_COMMIT=$PRIMER_COMMIT"

      # The image's own command, as comms-app runs it: it starts and
      # answers readiness (200 only with the database reached). Both
      # sides of the channel rule (W2-1): telegram and email switched on
      # with keys of the right shape that reach nothing (the token
      # assembled here: a literal of a real token's shape would trip
      # secret scanning), llm switched off -- its key not read.
      # THE PROFILE IS MOUNTED, AS ON A BOX (TX-4 FIX): the image carries
      # app/ and migrations/, not tests/ -- so the test profile is mounted
      # read-only on /primer/data/profile and TEMPLATES_DIR names it, the
      # path the machine gives comms-app the profile at (W4-1: primer.yaml
      # `accepts.profile`, /primer/data/<kind>; tests/test_deploy_hardening.py
      # holds both: every /app path of this step is in the image or
      # mounted, and TEMPLATES_DIR is the machine's path of the kind).
      # Once per build is enough: in part 1 only (CI-2) -- the same image
      # is built in each part, and the start says the same of each.
      # REDIS TOO (W3-1): /ready is 200 only with every check ok, the
      # `redis` check among them -- the Redis deploy/docker-compose.yml
      # pins, without a password here (nothing but this step reaches it).
      # MIGRATED FIRST, AS THE MACHINE DOES (FIX W3-1): the `db` check is
      # the read of the schema's revision (protocol 9.5), and since W1-2
      # the API's start migrates nothing -- the machine's step `migrate`
      # does, before `up`. So the database is migrated here by the same
      # image and the same command: `stacks.comms.migrate` of primer.yaml,
      # read from the file, in a throwaway container of comms:ci. Its
      # environment is the suite's below, not comms-app's whole one, as
      # the machine gives it: the migration reads only the database's
      # address of the settings (migrations/env.py).
      - name: The image starts (GET /ready)
        if: matrix.part == 1
        run: |
          migrate=$(python -c "import yaml; print(yaml.safe_load(open('primer.yaml'))['stacks']['comms']['migrate'])")
          docker run --rm --network host \
            -e APP_ENV=ci \
            -e DATABASE_URL=postgresql+asyncpg://comms:comms@127.0.0.1:5432/comms_test \
            -e COMMS_SERVICE_TOKEN=ci-not-a-secret-service-token \
            -e TELEGRAM_ENABLED=false -e EMAIL_ENABLED=false -e LLM_ENABLED=false \
            -e LANGUAGES=en,ru -e DEFAULT_LANGUAGE=en \
            comms:ci $migrate
          redis=$(python -c "import yaml; print(yaml.safe_load(open('deploy/docker-compose.yml'))['services']['comms-redis']['image'])")
          docker run -d --name comms-redis --network host "$redis" redis-server --port 6379
          token="123456789:$(printf 'A%.0s' $(seq 35))"
          docker run -d --name comms-app --network host \
            -e APP_ENV=ci \
            -e DATABASE_URL=postgresql+asyncpg://comms:comms@127.0.0.1:5432/comms_test \
            -e COMMS_SERVICE_TOKEN=ci-not-a-secret-service-token \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -v "$PWD/tests/fixtures/profile:/primer/data/profile:ro" \
            -e TEMPLATES_DIR=/primer/data/profile \
            -e TELEGRAM_ENABLED=true \
            -e EMAIL_ENABLED=true \
            -e LLM_ENABLED=false \
            -e LANGUAGES=en,ru -e DEFAULT_LANGUAGE=en \
            -e TELEGRAM_BOT_TOKEN="$token" \
            -e TELEGRAM_BOT_URL=https://t.me/comms_ci_bot \
            -e EMAIL_MAILGUN_API_KEY=ci-not-a-provider-key \
            -e EMAIL_MAILGUN_DOMAIN=mg.example.org \
            -e "EMAIL_FROM_ADDRESS=CI <ci@example.org>" \
            comms:ci
          for _ in $(seq 60); do
            if curl -sf http://127.0.0.1:8000/ready; then
              docker rm -f comms-app comms-redis
              exit 0
            fi
            sleep 1
          done
          docker logs comms-app
          exit 1

      # THE `comms` COMMAND (W2-2): the machine runs `comms derive <name>`
      # in a throwaway container of this image for primer.yaml's derived
      # values, so the command is on the image's PATH -- asked here of the
      # built image, not of the checkout. bot-id needs no network: its
      # value from a token of the right shape (assembled here: a literal of
      # a real token's shape would trip secret scanning), and a malformed
      # token refused with a non-zero exit and nothing of the token in what
      # it says. bot-url asks Telegram and is not run here (tests/test_derive.py).
      - name: The image has the comms command
        if: matrix.part == 1
        run: |
          token="123456789:$(printf 'B%.0s' $(seq 35))"
          id=$(docker run --rm -e TELEGRAM_BOT_TOKEN="$token" comms:ci \
              comms derive bot-id)
          test "$id" = "123456789"
          bad="not-a-token-$(printf 'C%.0s' $(seq 20))"
          if docker run --rm -e TELEGRAM_BOT_TOKEN="$bad" comms:ci comms derive bot-id \
              > "$RUNNER_TEMP/derive.out" 2> "$RUNNER_TEMP/derive.err"; then
            echo "a malformed token derived a value"
            exit 1
          fi
          cat "$RUNNER_TEMP/derive.err"
          test -s "$RUNNER_TEMP/derive.err"
          if grep -q "$bad" "$RUNNER_TEMP/derive.out" "$RUNNER_TEMP/derive.err"; then
            echo "the refusal carries the token"
            exit 1
          fi
          echo "comms derive bot-id: $id"
          # W4-1: the profile's validator, as the machine runs it -- the
          # command of primer.yaml `accepts.profile`, <dir> the copy's
          # path, in a throwaway container with no network and nothing of
          # the instance but that path.
          validate=$(python -c "import yaml; print(yaml.safe_load(open('primer.yaml'))['accepts']['profile']['validate'])")
          docker run --rm --network none --cap-drop ALL \
            -v "$PWD/tests/fixtures/profile:/primer/data/profile:ro" \
            -e TEMPLATES_DIR=/primer/data/profile \
            comms:ci ${validate//<dir>//primer/data/profile}

      # In the test stage, as the deploy machine runs it (W1-1): its
      # Python, Debian and packages, and its own copy of the tree --
      # nothing is mounted, so what is proved is the stage the machine
      # runs, not this checkout.
      - name: The suite inside the image
        run: |
          docker run --rm --network host \
            -e APP_ENV=ci \
            -e DATABASE_URL=postgresql+asyncpg://comms:comms@127.0.0.1:5432/comms_test \
            -e COMMS_SERVICE_TOKEN=ci-not-a-secret-service-token \
            -e TELEGRAM_ENABLED=false -e EMAIL_ENABLED=false -e LLM_ENABLED=false \
            -e LANGUAGES=en,ru -e DEFAULT_LANGUAGE=en \
            comms:test sh -c "alembic upgrade head && alembic check && python -m pytest -q --durations=50 $PART_ARGS"
