# =============================================================================
# COMMS Service -- Project Configuration
# =============================================================================
#
# Single source of truth for dependencies and tool configuration.
# Modeled on the cbshome/velo backend pyproject (same stack), trimmed to
# what the Phase 1 engine core actually needs:
#   - no redis yet (transport is Phase 3)
#   - no email libs yet (email channel is a stub in Phase 1)
#   - no pyyaml yet (templates come from the profile registry; file
#     loading of per-deploy template YAML is Phase 2 profile work)
# =============================================================================

[project]
name = "comms-service"
version = "0.1.0"
description = "COMMS -- standalone notifications + messaging service"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "pydantic-settings>=2.5.0,<3.0",
    "structlog>=24.0.0,<25.0",
    "aiogram>=3.13.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.11.0,<2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# =============================================================================
# Ruff -- formatter + linter (same select set as cbshome/velo)
# =============================================================================

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async linting
]
ignore = ["RUF012", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================================================================
# Mypy -- strict type checking
# =============================================================================

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/.pytest_cache"
