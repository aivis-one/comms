# =============================================================================
# COMMS Service -- Project Configuration
# =============================================================================
#
# Single source of truth for dependencies and tool configuration.
# Modeled on the cbshome/velo backend pyproject (same stack), trimmed to
# what the engine actually needs:
#   - no redis yet (transport is Phase 3)
#   - httpx is a runtime dependency (Phase R-1): the email channel
#     talks to the provider's HTTP API
#   - pyyaml is back (Phase 2): the per-deploy profile loader parses
#     types.yaml + templates/{locale}.yaml with yaml.safe_load ONLY
#   - tzdata (Phase 2): quiet-hours math resolves recipient IANA
#     timezones via zoneinfo; the pure-python tzdata package guarantees
#     the database exists even in slim container images without a
#     system zoneinfo directory
# =============================================================================

[project]
name = "comms-service"
version = "3.3.0"
description = "COMMS -- standalone notifications + messaging service"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.142.2,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "sqlalchemy[asyncio]>=2.1.2,<3.0",
    "asyncpg>=0.31.0,<1.0",
    "alembic>=1.20.0,<2.0",
    "pydantic-settings>=2.15.0,<3.0",
    "structlog>=26.1.0,<27.0",
    "aiogram>=3.31.0,<4.0",
    # The email channel's HTTP client. A RUNTIME dependency, declared
    # here rather than leaning on the aiohttp that arrives with aiogram:
    # capabilities must not depend on one another, and a deploy without
    # telegram would otherwise lose its mail client with it. Also a dev
    # dependency below (the API test client) -- same library, two roles.
    "httpx>=0.28.1,<1.0",
    "redis>=8.1.0,<9.0",
    "pyyaml>=6.0.3,<7.0",
    "tzdata>=2026.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "httpx>=0.28.1,<1.0",
    "ruff>=0.16.10,<1.0",
    "mypy>=2.4.0,<3.0",
    "types-PyYAML>=6.0.12.20260906,<7.0",
    "fakeredis>=2.39.0,<3.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# =============================================================================
# Ruff -- formatter + linter (same select set as cbshome/velo)
# =============================================================================

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async linting
]
ignore = ["RUF012", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================================================================
# Mypy -- strict type checking
# =============================================================================

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/.pytest_cache"
