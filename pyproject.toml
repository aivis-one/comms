# =============================================================================
# COMMS Service -- Project Configuration
# =============================================================================
#
# Single source of truth for dependencies and tool configuration.
# Modeled on the cbshome/velo backend pyproject (same stack), trimmed to
# what the engine actually needs:
#   - no redis yet (transport is Phase 3)
#   - httpx is a runtime dependency (Phase R-1): the email channel
#     talks to the provider's HTTP API
#   - pyyaml is back (Phase 2): the per-deploy profile loader parses
#     types.yaml + templates/{locale}.yaml with yaml.safe_load ONLY
#   - tzdata (Phase 2): quiet-hours math resolves recipient IANA
#     timezones via zoneinfo; the pure-python tzdata package guarantees
#     the database exists even in slim container images without a
#     system zoneinfo directory
# =============================================================================

[project]
name = "comms-service"
version = "3.13.0"
description = "COMMS -- standalone notifications + messaging service"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "pydantic-settings>=2.5.0,<3.0",
    "structlog>=24.0.0,<25.0",
    "aiogram>=3.13.0,<4.0",
    # The email channel's HTTP client. A RUNTIME dependency, declared
    # here rather than leaning on the aiohttp that arrives with aiogram:
    # capabilities must not depend on one another, and a deploy without
    # telegram would otherwise lose its mail client with it. Also a dev
    # dependency below (the API test client) -- same library, two roles.
    "httpx>=0.27.0,<1.0",
    "redis>=5.0.0,<6.0",
    "pyyaml>=6.0.0,<7.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    # A hung test is a red test, not a job that waits six hours
    # (FIX review 3.13.0, the second).
    "pytest-timeout>=2.4.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.11.0,<2.0",
    "types-PyYAML>=6.0.0,<7.0",
    "fakeredis>=2.23.0,<3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# =============================================================================
# Ruff -- formatter + linter (same select set as cbshome/velo)
# =============================================================================

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async linting
]
ignore = ["RUF012", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================================================================
# Mypy -- strict type checking
# =============================================================================

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/.pytest_cache"
# A TEST THAT HANGS IS RED (FIX review 3.13.0, the second): CI waited six
# hours on one that never returned. 300 s per test -- setup, call and
# teardown: the longest test (0037's measure, a 600 MB heap built) takes
# ~50 s here and two to three times that in CI; the first test also
# carries the session's setup (~6 s here). method = signal, by a measure:
# a hung async test holding a real db_session, then a test using the
# database -- with signal the hung one failed, the next one PASSED on a
# clean database, no warning of an unclosed loop or connection (only the
# hung test's own coroutine reported pending at exit); with thread the
# whole process went down at the first timeout. Signal keeps the run.
timeout = 300
timeout_method = "signal"
