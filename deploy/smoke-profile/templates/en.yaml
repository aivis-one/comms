# =============================================================================
# COMMS deploy -- generic SMOKE profile, templates, locale "en"
# =============================================================================
#
# Minimal generic template sheet for the three built-in chat types.
# Templates are OPTIONAL (a type without a sheet falls back to the
# stored title/body), but a tiny sheet exercises the template branch
# of profile validation during the deploy smoke run, which is the
# whole point of this profile.
#
# No URLs and no external domains anywhere: the startup fence over
# profile data rejects them (domains live in env, links are assembled
# at send time -- arch doc decision 13).
#
# YAML TRAP (inherited note): quote every value containing {braces} --
# a bare `body: {title}` is a flow mapping, not a string.
# =============================================================================

msg.participant_message:
  telegram:
    title: "{title}"
    body: "{body}"

msg.support_message:
  telegram:
    title: "{title}"
    body: "{body}"

msg.thread_closed:
  telegram:
    title: "{title}"
    body: "{body}"
