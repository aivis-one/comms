# =============================================================================
# COMMS deploy -- generic SMOKE profile (type dictionary)
# =============================================================================
#
# PURPOSE: the MINIMAL valid profile that lets the comms stack come up
# on a fresh VPS before the real per-product profile exists. The
# service refuses to start without a profile that passes the
# chat-baseline check (arch doc #15): all three built-in msg.* types
# declared, each with a non-empty preference category. This file is
# exactly that -- nothing more.
#
# `deploy install` copies this directory into the instance profile
# location (PROFILE_DIR) ONLY when that location is empty; the real
# product profile, authored in the product repo, is dropped in by the
# operator ON TOP (replacing this one) and survives `deploy update`.
#
# AGNOSTIC BY CONSTRUCTION: no product vocabulary (enforced by
# scripts/check_product_literals.py, which scans deploy/ too) and no
# external domains (enforced at startup by the profile data fence).
# =============================================================================

# The three built-in chat types comms emits unconditionally
# (app/core/constants.py: MSG_TYPE_KEYS). A type without a category
# would bypass the mute gate, so each carries one. Categories are
# generic families: muting "msg_chat" gates both message directions;
# "msg_system" gates the service notices.
msg.participant_message:
  category: msg_chat

msg.support_message:
  category: msg_chat

msg.thread_closed:
  category: msg_system
