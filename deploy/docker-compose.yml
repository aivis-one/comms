# =============================================================================
# COMMS -- Docker Compose, as Primer's deploy machine runs it (W1-2)
# =============================================================================
#
# The machine runs this file as `docker compose -p comms --env-file <its
# rendered env> -f deploy/docker-compose.yml -f <its override>`: the
# project name, the values and the networks towards the product are the
# machine's (contract 3, protocol 3.3-3.4). `pridem check` holds this file
# to the machine's rules in CI (scripts/check_primer_yaml.py, job
# `machine`); the one finding it is allowed is the profile's mount, below.
#
# FIVE services, THREE of them from the ONE root Dockerfile (same image,
# different commands):
#   comms-app      -- the API: the image's own CMD (Dockerfile), the one
#                     source of its command; it does NOT migrate. The
#                     schema is the machine's step `migrate` (primer.yaml
#                     stacks.comms.migrate), run in a throwaway container
#                     of this service before `up`, with the three
#                     application services stopped (stop_for_migrate);
#   comms-worker   -- delivery loop (python -m app.worker);
#   comms-consumer -- product event stream reader (python -m
#                     app.consumer) and the push relay back to the
#                     product (P3-1);
#   comms-postgres -- dedicated database (never the product's);
#   comms-redis    -- DURABLE stream backbone (DD-4): AOF + noeviction +
#                     requirepass. NOT a cache.
#
# VALUES (protocol 3.4, contract 3 rules 18, 33): no env_file; every
# value is `${KEY:?}` of a key of primer.yaml `env`, or a constant here.
# Two settings comms reads are built here from keys of `env`:
# DATABASE_URL from POSTGRES_PASSWORD, REDIS_URL from
# COMMS_EVENTS_PASSWORD (tests/test_primer_yaml.py COMPOSED). A key of a
# switched-off option holds the machine's literal, which comms never
# reads; `:?` refuses a key that is absent or empty -- a red start.
#
# NETWORKS: none towards the product here. The machine's override puts
# comms-app on its network `pridem` as `comms-comms-app` (COMMS_API_URL)
# and comms-redis on the network of each pair of the point `events` as
# `comms-comms-redis` (COMMS_EVENTS_ADDRESS); see deploy/INTEGRATION.md
# section 1. comms-internal holds all five; the database lives only there.
# The three application services are also on `default`: they reach the
# channels' providers (Telegram, Mailgun, the llm gateways).
#
# THE PROFILE -- temporarily, until W4-1: a literal bind of a host path,
# the one finding the machine is allowed here (KNOWN CEILING in
# scripts/check_primer_yaml.py, the full marker). The text overlay
# (TEMPLATES_OVERLAY_DIR) has no form here until W4-1: comms runs on the
# profile alone.
# =============================================================================

# What every application process reads from the instance, by the keys of
# primer.yaml `env` (tests/test_primer_yaml.py holds both ways).
x-comms-env: &comms-env
  TEMPLATES_DIR: /profile
  DATABASE_URL: postgresql+asyncpg://comms:${POSTGRES_PASSWORD:?}@comms-postgres:5432/comms
  COMMS_SERVICE_TOKEN: ${COMMS_SERVICE_TOKEN:?}
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:?}
  EMAIL_ENABLED: ${EMAIL_ENABLED:?}
  LLM_ENABLED: ${LLM_ENABLED:?}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
  TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:?}
  EMAIL_MAILGUN_API_KEY: ${EMAIL_MAILGUN_API_KEY:?}
  EMAIL_MAILGUN_DOMAIN: ${EMAIL_MAILGUN_DOMAIN:?}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?}
  EMAIL_MAILGUN_REGION: ${EMAIL_MAILGUN_REGION:?}
  LLM_KEY_SETS: ${LLM_KEY_SETS:?}

services:
  comms-app:
    build:
      context: ..
    # No command: the image's CMD (Dockerfile) -- uvicorn with its log
    # config, no migration. NO ports: internal by design (DD-5); the
    # product reaches it through the machine's network.
    environment: *comms-env
    volumes:
      - /srv/comms/profile:/profile:ro
    depends_on:
      comms-postgres: { condition: service_healthy }
      comms-redis: { condition: service_healthy }
    healthcheck:
      # /ready answers 503 while the database is unreachable; the
      # probe runs in-container (no published port needed).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - comms-internal

  comms-worker:
    build:
      context: ..
    environment: *comms-env
    command: ["python", "-m", "app.worker"]
    volumes:
      - /srv/comms/profile:/profile:ro
    depends_on:
      # The schema is migrated before `up` (the machine's `migrate`):
      # the worker waits for its database only, not for the API.
      comms-postgres: { condition: service_healthy }
    healthcheck:
      # Single-process container: the meaningful liveness signal is
      # "PID 1 is the worker". No pgrep in the slim image, so read
      # procfs directly.
      test: ["CMD-SHELL", "grep -q app.worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - comms-internal

  comms-consumer:
    build:
      context: ..
    environment:
      <<: *comms-env
      # The consumer alone reads Redis (app/transport/connection.py).
      REDIS_URL: redis://:${COMMS_EVENTS_PASSWORD:?}@comms-redis:6379/0
    command: ["python", "-m", "app.consumer"]
    volumes:
      - /srv/comms/profile:/profile:ro
    depends_on:
      comms-postgres: { condition: service_healthy }
      comms-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "grep -q app.consumer /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - comms-internal

  comms-postgres:
    # Pinned by digest, like every image comms names (H10): a tag such as
    # postgres:16 resolves to whatever was pulled last on each box -- two
    # boxes were on 16.14 and 16.15 under one tag. The tag stays for the
    # reader and for Dependabot (.github/dependabot.yml, ecosystem
    # docker-compose), which brings a new digest as a pull request. CI
    # runs this same image (.github/workflows/ci.yml reads it from here).
    # tests/test_image_pins.py holds the pins.
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    # ITS OWN VARIABLES ONLY (TX-4): the database has no business holding
    # the channel tokens and LLM keys. The user and the database are
    # constants of comms, the password the machine's minted key.
    environment:
      POSTGRES_USER: comms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: comms
    # NO published port: nothing on the host needs it.
    # max_connections WRITTEN, not left to the image's default (H7):
    # every comms process's pool at full overflow, the worker's wake
    # listener and the connections outside any pool must fit it --
    # app/core/database.py POOLS, held against this line and the
    # --workers of comms-app's command (the Dockerfile's CMD) by
    # tests/test_connection_budget.py.
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # comms-internal ONLY (TX-4): no product reaches this database, and
    # it has no route out of the box.
    networks:
      - comms-internal

  comms-redis:
    # Pinned by digest -- see comms-postgres above.
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    # Its own variable only (TX-4), as comms-postgres: the password is
    # the machine's minted COMMS_EVENTS_PASSWORD, the one the product
    # gets as a seam.
    environment:
      REDIS_PASSWORD: ${COMMS_EVENTS_PASSWORD:?}
    # DD-4 (extended): durable AND protected. AOF + noeviction --
    # the stream carries notification_request, eviction would mean
    # silently dropped notifications; requirepass -- the product reaches
    # this server over the machine's network of the pair.
    # THE PASSWORD IS NOT AN ARGUMENT (TX-4): `--requirepass <value>`
    # stood in redis-server's argv, readable by anyone on the host with
    # `ps`. The shell writes it into a config file INSIDE the container,
    # under umask 077, and then `exec`s redis-server on that file --
    # exec as the LAST command of the shell, not in a pipeline, so
    # redis-server REPLACES the shell as PID 1: `docker stop`'s SIGTERM
    # reaches Redis, which shuts down cleanly and flushes its AOF,
    # instead of a shell that ignores it until the SIGKILL ten seconds
    # later. printf is the shell's builtin: no process carries the
    # value in its arguments either.
    command:
      - sh
      - -c
      - >-
        umask 077
        && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        && exec redis-server /tmp/redis.conf
        --appendonly yes
        --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH keeps the password out of CLI args.
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$REDIS_PASSWORD; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - comms-internal

networks:
  # comms' own network (TX-4): all five services; internal -- no way out
  # of the box from it. Its name is the machine's: <project>_comms-internal.
  comms-internal:
    internal: true

volumes:
  # Named by the project: under the machine's `-p comms` they are
  # comms_postgres_data and comms_redis_data on disk; primer.yaml
  # `persistent: true` keeps them through destroy and reinstall.
  postgres_data:
  redis_data:
