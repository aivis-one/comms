name: comms
# The compose PROJECT name, declared rather than inferred.
#
# Unset, compose derives it from the directory holding this file, which is an
# accident of the checkout layout: two stacks whose files both sit in `deploy/`
# resolve to ONE project, and one whose file sits in a repository root becomes
# `repo`. Same project means one label namespace -- `ps` from either directory
# lists the other's containers, every `up -d` reports the other's as orphans,
# and `down --remove-orphans` from either destroys the other.
#
# CONVENTION for every service on these servers: declare it here, first line,
# equal to the service name. A stack that does not is one directory rename away
# from colliding with a stack it has never heard of.
#
# Nothing observes this except a live docker daemon, so no test covers it.

# =============================================================================
# COMMS -- Docker Compose (deploy/, Phase 5)
# =============================================================================
#
# The comms stack as its OWN compose project, sitting NEXT TO the
# product stack on one VPS (DD-1/DD-3, variant A): dedicated
# containers, nothing shared with the product except the external
# docker network "aivis-shared".
#
# FIVE services, THREE of them from the ONE root Dockerfile
# (same image, different commands):
#   comms-app      -- uvicorn API; the ONLY migrator (alembic runs
#                     before uvicorn, so "app is healthy" implies
#                     "schema is migrated");
#   comms-worker   -- delivery loop (python -m app.worker);
#   comms-consumer -- product event stream reader (python -m
#                     app.consumer), the integration backbone; and
#                     the push relay back to the product (P3-1);
#   comms-postgres -- dedicated database (never the product's);
#   comms-redis    -- DURABLE stream backbone (DD-4): AOF +
#                     noeviction + requirepass. NOT a cache.
#
# INTERNAL SERVICE (DD-5): comms-app publishes NO host port and gets
# no nginx route. The only way in is over "aivis-shared" from the
# product backend, presenting the shared service token.
#
# The network is EXTERNAL: created once, idempotently, by
# `comms-deploy.sh install` (docker network create aivis-shared);
# the product stack joins the same network on its side.
#
# Environment comes from ./.env (written by `install`, never
# committed). PROFILE_DIR points at the per-instance profile
# directory OUTSIDE the checkout (survives `update`); it is
# bind-mounted read-only and exposed to the service as
# TEMPLATES_DIR=/profile.
#
# PROFILE_OVERLAY_DIR (optional, PO-1) points at the TEXT OVERLAY:
# {locale}.yaml files replacing single texts of the profile
# (deploy/INTEGRATION.md section 3). Set -> mounted read-only at
# /profile-overlay and exposed as TEMPLATES_OVERLAY_DIR=/profile-overlay.
# Empty or absent from .env -> TEMPLATES_OVERLAY_DIR is empty and the
# service runs on the profile alone; the mount then carries PROFILE_DIR
# only because a bind needs an existing source, and nothing reads it.
# A set path that does not exist must refuse the start: the long syntax
# with create_host_path: false says so to compose, and comms-deploy.sh
# checks it before every `up` (check_overlay_dir) because some compose
# releases create the path anyway -- an empty directory would then pass
# for "no overrides".
#
# Usage (via the CLI next to this file):
#   comms-deploy.sh install | update | logs | db | status
# =============================================================================

services:
  comms-app:
    build:
      context: ..
    container_name: comms-app
    env_file:
      - ./.env
    environment:
      # The in-container profile mount point; the host side is
      # PROFILE_DIR from .env (see volumes below).
      TEMPLATES_DIR: /profile
      TEMPLATES_OVERLAY_DIR: ${PROFILE_OVERLAY_DIR:+/profile-overlay}
    # The ONLY migrator: schema first, then the server. `exec` hands
    # PID 1 to uvicorn (clean signal handling). Worker/consumer gate
    # on this container's health, so they never race the migration.
    command: >
      sh -c "alembic upgrade head
      && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 2 --proxy-headers"
    # NO ports: section -- internal by design (DD-5). Port 8000 is
    # reachable only inside "aivis-shared" as http://comms-app:8000.
    volumes:
      - ${PROFILE_DIR}:/profile:ro
      - type: bind
        source: ${PROFILE_OVERLAY_DIR:-${PROFILE_DIR}}
        target: /profile-overlay
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      comms-postgres: { condition: service_healthy }
      comms-redis: { condition: service_healthy }
    healthcheck:
      # /ready answers 503 while the database is unreachable; the
      # probe runs in-container (no published port needed).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - aivis-shared
      - comms-internal

  comms-worker:
    build:
      context: ..
    container_name: comms-worker
    env_file:
      - ./.env
    environment:
      TEMPLATES_DIR: /profile
      TEMPLATES_OVERLAY_DIR: ${PROFILE_OVERLAY_DIR:+/profile-overlay}
    command: ["python", "-m", "app.worker"]
    volumes:
      - ${PROFILE_DIR}:/profile:ro
      - type: bind
        source: ${PROFILE_OVERLAY_DIR:-${PROFILE_DIR}}
        target: /profile-overlay
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      # Healthy app == migration done; the worker never touches an
      # unmigrated schema and never runs alembic itself.
      comms-app: { condition: service_healthy }
    healthcheck:
      # Single-process container: the meaningful liveness signal is
      # "PID 1 is the worker". No pgrep in the slim image, so read
      # procfs directly.
      test: ["CMD-SHELL", "grep -q app.worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - aivis-shared
      - comms-internal

  comms-consumer:
    build:
      context: ..
    container_name: comms-consumer
    env_file:
      - ./.env
    environment:
      TEMPLATES_DIR: /profile
      TEMPLATES_OVERLAY_DIR: ${PROFILE_OVERLAY_DIR:+/profile-overlay}
    command: ["python", "-m", "app.consumer"]
    volumes:
      - ${PROFILE_DIR}:/profile:ro
      - type: bind
        source: ${PROFILE_OVERLAY_DIR:-${PROFILE_DIR}}
        target: /profile-overlay
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      comms-app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "grep -q app.consumer /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - aivis-shared
      - comms-internal

  comms-postgres:
    # Pinned by digest, like every image comms names (H10): a tag such as
    # postgres:16 resolves to whatever was pulled last on each box -- two
    # boxes were on 16.14 and 16.15 under one tag. The tag stays for the
    # reader and for Dependabot (.github/dependabot.yml, ecosystem
    # docker-compose), which brings a new digest as a pull request into
    # `test`. CI runs this same image (.github/workflows/ci.yml reads it
    # from here). tests/test_image_pins.py holds the pins.
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    container_name: comms-postgres
    # ITS OWN VARIABLES ONLY (TX-4), not the whole .env: the database
    # has no business holding the channel tokens and LLM keys. Compose
    # fills them from the project's .env (the deploy/.env link).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    # NO published port (unlike the product's postgres): nothing on
    # the host needs it; the CLI's `db` subcommand goes through
    # `docker compose exec`.
    # max_connections WRITTEN, not left to the image's default (H7):
    # every comms process's pool at full overflow, the worker's wake
    # listener and the connections outside any pool must fit it --
    # app/core/database.py POOLS, held against this line and the
    # --workers of comms-app by tests/test_connection_budget.py.
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - comms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # comms-internal ONLY (TX-4): the products never reach this
    # database -- they speak to comms-app over aivis-shared -- so it is
    # not in the shared network at all.
    networks:
      - comms-internal

  comms-redis:
    # Pinned by digest -- see comms-postgres above.
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: comms-redis
    # Its own variable only (TX-4), as comms-postgres.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set in .env}
    # DD-4 (extended): durable AND protected. AOF + noeviction --
    # the stream carries notification_request, eviction would mean
    # silently dropped notifications; requirepass -- the container
    # sits on a network shared with the product stack. The password
    # is mandatory here (no passwordless fallback): this compose is
    # deploy-only, and .env is generated by `install`.
    # THE PASSWORD IS NOT AN ARGUMENT (TX-4): `--requirepass <value>`
    # stood in redis-server's argv, readable by anyone on the host with
    # `ps`. The shell writes it into a config file INSIDE the container,
    # under umask 077, and then `exec`s redis-server on that file --
    # exec as the LAST command of the shell, not in a pipeline, so
    # redis-server REPLACES the shell as PID 1: `docker stop`'s SIGTERM
    # reaches Redis, which shuts down cleanly and flushes its AOF,
    # instead of a shell that ignores it until the SIGKILL ten seconds
    # later. printf is the shell's builtin: no process carries the
    # value in its arguments either.
    command:
      - sh
      - -c
      - >-
        umask 077
        && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        && exec redis-server /tmp/redis.conf
        --appendonly yes
        --maxmemory-policy noeviction
    volumes:
      - comms_redis_data:/data
    healthcheck:
      # REDISCLI_AUTH keeps the password out of CLI args.
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$REDIS_PASSWORD; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Both: the products publish to comms' stream over aivis-shared
    # (COMMS_REDIS_URL, handed over by comms-deploy.sh install).
    networks:
      - aivis-shared
      - comms-internal

networks:
  aivis-shared:
    external: true
  # comms' own network (TX-4): comms-postgres lives only here, the
  # application containers and comms-redis in both. internal: no way
  # out of the box from it -- the database needs none.
  comms-internal:
    name: comms-internal
    internal: true

volumes:
  # Physical names pinned, so that they do NOT carry the project name as a
  # prefix. Unpinned, `comms_postgres_data` under project `comms` would land on disk as
  # `comms_comms_postgres_data` -- the service name twice -- and would move again the day
  # the project name did. Pinned, the name on disk is the name written here.
  comms_postgres_data:
    name: comms_postgres_data
  comms_redis_data:
    name: comms_redis_data
