# =============================================================================
# COMMS Service -- pinned dependency resolution
# =============================================================================
#
# WHY A LOCK AT ALL: pyproject states RANGES, so the image built today
# and the image built next month resolve to different versions of every
# transitive dependency -- and the difference is discovered in
# production, in someone else's stack, with no way to tell which build
# is running. This file is the resolution itself, and both the CI job
# and the Dockerfile install from it.
#
# WHY HASHES: a version pin says WHICH release; a hash says which
# ARTIFACT. comms is pulled into other people's builds, and a
# substituted wheel on a mirror is the one thing a version pin cannot
# catch. `pip install -r` switches into hash-checking mode by itself
# when the file carries them -- no change to CI or the Dockerfile. The
# hashes cover every platform's wheel, not just the machine that
# generated them, so an image built on another architecture still
# resolves.
#
# REGENERATE (whenever pyproject's dependencies change, in the same
# commit) -- KEEP THE FLAG: without --generate-hashes the file still
# installs and still pins versions, so nothing fails and the artifact
# guarantee is quietly gone. tests/test_delivery_contract.py refuses a
# lock whose lines have no hash, which is the only thing that notices.
#
#     uv pip compile pyproject.toml --extra dev --python-version 3.12 \
#         --generate-hashes -o requirements.lock
#
# DEV DEPENDENCIES ARE INCLUDED ON PURPOSE. The runtime image carries
# the suite by design (see Dockerfile) because the suite is run in the
# container on the VPS; an image whose pytest is a different version
# than CI's would make that run mean something else.
#
# A dependency added to pyproject and not regenerated here is caught by
# tests/test_delivery_contract.py, not by a build failure in a month.
# =============================================================================
