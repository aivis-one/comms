# =============================================================================
# COMMS Service -- Alembic Configuration
# =============================================================================
# Modeled on the cbshome backend. The real database URL is read from
# settings (DATABASE_URL env) inside migrations/env.py -- the value
# below is a placeholder and never used.
# =============================================================================

[alembic]
script_location = migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url = placeholder://set-in-env-py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
