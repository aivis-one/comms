# =============================================================================
# COMMS test profile -- notification type records
# =============================================================================
# REFERENCE SHAPE for the real product profile (comms-profile/ in the
# product repo): schema version 2 (app/profile/loader.py).
#
#   version: 2          -- required; any other version refuses startup
#   types:              -- a MAPPING {type_key: {field: value}}
#
# A type record is CLOSED: the fields of deploy/INTEGRATION.md section 3,
# "The type record -- every field" (held to the loader by
# tests/test_g2_hygiene.py), plus keys in the reserved x- namespace.
# That table is the one place the record is written down; this file
# is a profile, not a second copy of it. Any other key refuses startup
# by name -- a typo must not read as "not declared". Every field is
# optional; an omitted field takes the comms default, and the registry
# remembers which layer decided (registry.explain).
#
# The llm kind is built by tests/test_llm_channel.py, not here.
# =============================================================================

version: 2

types:
  # Single event type with its own category.
  # The channels live HERE, per type (F1.2) -- a request never names
  # one. unit_event goes to telegram; the unit_event_* siblings carry
  # the other channel sets the suite needs, with the same category (so
  # one mute gates them all) and the same template sheets (YAML anchors
  # in templates/*.yaml).
  unit_event:
    category: unit_updates
    channels: [telegram]
  unit_event_in_app:
    category: unit_updates
    channels: [in_app]
  unit_event_email:
    category: unit_updates
    channels: [email]
  unit_event_telegram_in_app:
    category: unit_updates
    channels: [telegram, in_app]
  unit_event_in_app_email:
    category: unit_updates
    channels: [in_app, email]
  unit_event_telegram_email:
    category: unit_updates
    channels: [telegram, email]

  # A reminder FAMILY: three types, ONE category -- muting
  # "unit_reminder" gates all three.
  unit_rem_24h:
    category: unit_reminder
    channels: [telegram]
  unit_rem_1h:
    category: unit_reminder
    channels: [telegram]
  unit_rem_10m:
    category: unit_reminder
    channels: [telegram]

  # No category (never mute-gated) and no templates -- stored
  # title/body are the fallback.
  unit_plain:
    channels: [telegram]

  # A type with an EMPTY spec: legal -- every field from the comms
  # default (channels: in_app, no category, no expiry).
  unit_bare: {}

  # A profile-declared expiry (F1.2): counted from scheduled_at.
  unit_expiring:
    expires_after: 1h

  # Presentation-keys demo (Phase 3a item 1): the template sheet for
  # this type carries button_text / disable_preview / silent -- see
  # templates/en.yaml for the reference shape.
  unit_presented:
    channels: [telegram]

  # -----------------------------------------------------------------------------
  # Messaging chat types (Phase 4c). comms emits these abstract keys; the
  # product profile maps them to the locked msg_* categories. A thread-
  # closed notice goes to the client -> the participant category.
  # (The real VELO dictionary supplies these in Phase 6.)
  # -----------------------------------------------------------------------------
  msg.participant_message:
    category: msg_participants
  msg.support_message:
    category: msg_support
  msg.thread_closed:
    category: msg_participants

  # Every routing field spelled out (reference shape). `category` is
  # left out on purpose -- the one field this record takes from the
  # comms default (no category -> not mute-gated). Channels
  # are in_app only ON PURPOSE: the suite runs with every external
  # channel's keys blanked (tests/conftest.py), and the startup path
  # refuses a route into a channel this deploy did not configure.
  unit_routed:
    channels: [in_app]
    lane: interactive
    push_on: outcome
    recipient_schedule: bypass
    expires_after: 15m
    retry_max_attempts: 2
    retry_backoff_seconds: 0
    max_body_chars: 1000
    x-note: "extension keys are tolerated and never reach the record"
