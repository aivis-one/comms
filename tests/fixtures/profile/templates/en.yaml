# =============================================================================
# COMMS test profile -- templates, locale "en"
# =============================================================================
# Tree shape: {type: {channel: {field: template_str}}} -- 1:1 with
# registry.register_templates. Template language is str.format_map
# (SafeDict): {var} placeholders, missing variables stay literal.
#
# YAML TRAP: a bare `body: {title}` is a FLOW MAPPING, not a string.
# Always QUOTE values containing braces (the loader rejects the
# unquoted form at startup with a hint).
# =============================================================================

unit_event:
  telegram:
    title: "{title}"
    body: "{body} [{extra}]"
  email:
    subject: "COMMS: {title}"

# Presentation keys (Phase 3a item 1): the sheet owns PRESENTATION,
# not only text -- per (type, channel). Reference shape:
#   button_text     -- localizable TEMPLATE for the inline deep-link
#                      button label (plain text: inline-button labels
#                      are not HTML-parsed, so its variables are NOT
#                      escaped);
#   disable_preview -- YAML BOOLEAN (unquoted true/false; a quoted
#                      "true" is a string and fails validation);
#   silent          -- YAML BOOLEAN, Telegram disable_notification.
# channel_options with the SAME keys override these per delivery
# (priority: sheet < channel_options).
unit_presented:
  telegram:
    title: "{title}"
    body: "{body}"
    button_text: "Open {title}"
    disable_preview: false
    silent: true
