# =============================================================================
# COMMS test profile -- templates, locale "ru"
# =============================================================================
# Deliberately PARTIAL: only unit_event.telegram.body. Everything else
# falls back per the chain: recipient locale -> default locale (en) ->
# stored title/body. Locales do not need to mirror each other.
# =============================================================================

unit_event: &unit_event_sheet
  telegram:
    body: "RU: {body}"

# Presentation keys are locale-resolved PER FIELD like the texts:
# ru overrides button_text only; disable_preview / silent fall back
# to the default locale (en).
unit_presented:
  telegram:
    button_text: "Открыть {title}"

# The unit_event_* siblings (types.yaml) share unit_event's sheet: a YAML
# alias, one sheet, no copies to drift.
unit_event_in_app: *unit_event_sheet
unit_event_email: *unit_event_sheet
unit_event_telegram_in_app: *unit_event_sheet
unit_event_in_app_email: *unit_event_sheet
unit_event_telegram_email: *unit_event_sheet
